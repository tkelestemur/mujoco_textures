[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-textures"
version = "0.1.0"
description = "Texture assets and randomization demos for MuJoCo and MuJoCo Warp."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Tarik Kelestemur" },
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
visualize = [
  "mujoco>=3.3.0",
  "mujoco-warp",
  "warp-lang",
  "viser",
  "mjviser",
]

[tool.uv.sources]
mujoco-warp = { git = "https://github.com/tkelestemur/mujoco_warp.git", branch = "tarik/texture-dr" }

[project.scripts]
mujoco-textures-list = "mujoco_textures.textures:main"
mujoco-textures-download = "mujoco_textures.download_textures:main"
mujoco-textures-viser = "mujoco_textures.randomize_textures_viser:main"

[tool.hatch.build.targets.wheel]
packages = ["mujoco_textures"]

[tool.hatch.build.targets.wheel.force-include]
"textures" = "mujoco_textures/textures"

[tool.hatch.build.targets.sdist]
include = [
  "/mujoco_textures",
  "/docs",
  "/scripts",
  "/textures",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
