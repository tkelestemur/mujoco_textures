[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-assets"
version = "0.1.0"
description = "Texture assets and randomization demos for MuJoCo and MuJoCo Warp."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Tarik Kelestemur" },
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
visualize = [
  "mujoco>=3.3.0",
  "mujoco-warp",
  "warp-lang",
  "viser",
  "mjviser",
]

[project.scripts]
mujoco-assets-list = "mujoco_assets.textures:main"
mujoco-assets-download = "mujoco_assets.download_textures:main"
mujoco-assets-viser = "mujoco_assets.randomize_textures_viser:main"

[tool.hatch.build.targets.wheel]
packages = ["mujoco_assets"]

[tool.hatch.build.targets.wheel.force-include]
"textures" = "mujoco_assets/textures"

[tool.hatch.build.targets.sdist]
include = [
  "/mujoco_assets",
  "/scripts",
  "/textures",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
